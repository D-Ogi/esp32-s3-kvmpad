  - test_id: AT-HW-1.2-7   # HOST off / auxiliary power, no backfeed
    <<: *common
    result: BLOCKED
    steps: "Schematic review first (02 section 1.2 item 7: do not risk backfeed); then, with auxiliary power from Type_C1 only, the HID cable plugged in, removed (HOST power gone) and plugged in again; console 'usb' after each step"
    observed: >-
      Waveshare schematic (ESP32-S3-Touch-LCD-7B-Schematic.pdf): the VBUS pins of the HID connector Type_C2 are wired
      straight to the board 5V rail (only TVS2 to GND, no diode or switch). The rail is also fed from the UART connector
      (VUART -> AO3401 ideal diode Q10 -> 5V), from the battery boost (CS8501 VOUT) and from the 5V header J9. So with
      auxiliary power the board drives VBUS of the HOST port: a HOST that is off would be back-fed. The HOST-off test with
      auxiliary power and the cable attached was therefore not performed. Simulated instead by removing the HID cable while
      powered from Type_C1: no report sent, but the device saw only bus idle and reported USB_SUSPENDED (umounts=0), not
      DETACHED. Re-plugging started a new USB epoch (epoch 2, mounts 2, 3 neutral reports, USB_ENUM PASS), so nothing of the
      old session can be replayed. VBUS sensing (esp_tinyusb self_powered + vbus_monitor_io) cannot fix this on the 7B: the
      HID-port VBUS is the same net as the board 5V rail.
    evidence:
      - "evidence/hardware/ESP32-S3-Touch-LCD-7B-Schematic.pdf sha256=60d31638254809aa39af0c5cc774ae4d2ebb73bdc4e57f68593cc4f559dec76c (https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-7B/ESP32-S3-Touch-LCD-7B-Schematic.pdf)"
      - "evidence/hardware/7B-schematic-crop-usb-hid.png sha256=9bafb18e44f560f3a2d2e5e953acca3e083eee60cfc460fe7c3dc40b38ba27de"
      - "evidence/hardware/7B-schematic-crop-usb-uart.png sha256=c3ec5ff52c35b0a51f8a872afd68799031d213437782eafe24254aed6ecc21a0"
      - "evidence/hardware/7B-schematic-crop-battery.png sha256=b5872af1b1943fcdd367b59b6854959189070addec58b997bd7c6be38c30c905"
      - "evidence/hardware/20261102-033132-cmd.log sha256=b43a28382e8899743cbe1e0501b448d0807b8df79dff37ad60da58f7f18ceda1"
      - "evidence/hardware/20261102-033302-cmd.log sha256=ce18adbc3f27a9492b212acbaccdc743dcef6a4bcfd5e71298afa4b45f6b464b"
      - "evidence/hardware/20261102-033302-usb-enum-windows.log sha256=1275989ab0ed833922b071b7802ddd6788087a060d54b6c67d9b9b14c851f83c"
    issues:
      - "Status-function limitation (02 section 1.2 item 7): on the 7B the firmware cannot tell 'HOST off / cable removed' from 'HOST suspended' when the board has auxiliary power; both show as USB_SUSPENDED and must be treated as HOST not active (no HID, RELEASE_ALL). Supported power configuration: the HID port alone. Auxiliary power (UART port, J9, battery) with the cable on a HOST that may be off back-feeds the HOST; not supported without a VBUS-blocking cable/adapter."
      - "Backfeed voltage/current not measured (no USB tester or multimeter at the bench): NOT_RUN_HW."
