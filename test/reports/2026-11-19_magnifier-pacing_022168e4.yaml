evidence_files: [timing.json, legacy.json, host-tests.log, SHA256SUMS]
fixtures:
  consent: An explicit private stdin decision replaces the foreground approval window.
  source: A native fixture generates a clock-indexed cursor on its own 1440x1080 texture and verifies every pre-encode BGRA pixel.
  receiver: A software board validates KVS/CROP1 and supplies a controlled presentation completion. FFmpeg independently decodes sampled pictures.
checks:
  - Original KVS and crop-only receiver behavior passed with JPEG, H.264 intra and Cinepak intra, including denial, revoke and Freeze.
  - 30 HOST tests passed with the native stdin encoders and the firmware HID protocol fixture. No physical HID input was used.
  - Eight invalid negotiations were refused before consent. Eight invalid, premature-sequence or duplicate feedback cases ended the grant.
  - A slow image writer or missing display credit prevented new capture demand. Six consecutive stale captures produced no image.
  - Freeze retired an uncompleted frame. Its late confirmation after Resume did not release the current frame. Stop and local revoke closed both sockets.
  - Identical encoded/decoded hashes for original and crop-aware sessions remained valid. The existing C wire parser refused 24 malformed or mismatched pairs.
firmware_integration:
  transport: >-
    The complete bridge.c worker ran with a desktop WebSocket adapter against the production
    HOST over loopback mutual TLS. It negotiated 10 FPS and waited for local display consent.
    Withheld feedback kept the source at one picture. A wrong epoch, wrong sequence and
    duplicate completion generated no additional credit. The worker reported a rendered
    picture and a rejected picture, retired a third on Freeze and credited a fourth after Resume.
    Stop closed both sockets and returned the link and capture indicators to idle.
  presenter: >-
    The production LVGL panel ran under AddressSanitizer. Cinepak 960x540 and H.264 512x512
    emitted one shown completion with the original epoch and sequence after refresh. Their
    screen CRCs were 5552606e and 262b896e. An idle repaint emitted no duplicate. Six
    correctly framed pictures with corrupted payloads each emitted one discarded completion.
  hid: >-
    Holding the first decode while submitting 10 maximum-size pictures in 1000 simulated ms
    preserved all 207 report completions in the idle HID baseline. Keyboard neutral followed
    Stop within two scheduler polls. The previous epoch was refused after reopening the screen.
  evidence: [evidence/build/magnifier-presentation/loopback.log, evidence/build/magnifier-presentation/panel/run.log, evidence/build/magnifier-presentation/hid/run.log]
observations:
  jpeg_initial_fps: 4.993
  jpeg_tail_fps: 9.931
  jpeg_withheld_credit_ms: 360
  elapsed_native_capture_ms_across_stall: 500
  following_demand_interval_ms: 501
  discarded_frame_interval_ms: 1001
  resume_interval_ms: 201
  no_credit_timeout_s: 3.001
  legacy_crop_only_fps: 4.987
  h264_tail_fps_over_last_eight_intervals: 5.004
  cinepak_tail_fps_over_last_eight_intervals: 9.909
  frames_in_each_h264_and_cinepak_adaptive_run: 40
follow_up_2026_11_20:
  result: PASS_SW
  quiet_source: >-
    Windows.Graphics.Capture recorded a test-owned, offscreen 96x64 green visual. In three
    runs it produced no extra sample during 1,312 to 1,313 ms without changes. On the next
    request, the production demand logic renewed the session and pool once for the same item
    at 250 ms. A new Windows sample arrived 31 ms later in each run. Its timestamp advanced
    and all 6,144 pixels still matched.
  picker_and_source_timeout: >-
    The loopback HOST returned DENIED with reason pickedwindow when the source reported a
    window selection. The firmware prompted for a whole monitor before opening local review
    or binding the image channel. A frame-read timeout after capture started closed both
    WebSockets with code 4002 and an empty reason. The firmware recognized 4002 on either
    socket and reported that Windows timed out waiting for an image. The host regression
    and all 24 firmware capture-status paths passed.
  h264_panel: >-
    The LVGL test decoded a 512x512 H.264 picture. After 1.6 seconds without another refresh,
    the panel marked the picture stale and cleared its rate. The first fresh picture showed
    RX to LCD and the rate returned after one second of fresh pictures. Freeze preserved the
    full viewport CRC for eight simulated seconds. Resume restarted the measurement.
    Six invalid pictures over six simulated seconds expired the stream and the panel
    rejected another picture from that epoch.
  crop_backpressure: >-
    The HOST encoded a static 512x512 source with FFmpeg. Sequences 0 and 1 delivered identical
    baseline H.264 IDRs. Decoding the first gave luma 112 across all 262,144 pixels. The CROP1 write for
    sequence 2 finished 1,182.6 ms after the request, beyond the one-second budget. The HOST
    ended the session with sequence 1 as its last binary image. The receiver observed three
    metadata records and two images.
  evidence:
    - evidence/build/wgc-offscreen-visual/result.log
    - evidence/build/magnifier-picker-feedback/capture-status.log
    - evidence/build/live-rate-freshness/after.log
    - evidence/build/magnifier-pacing/metadata-backpressure.json
  physical_monitor_capture: No new capture of a user-selected physical monitor was run for this follow-up.
installed_host_composite:
  result: PASS_SW
  scope: >-
    The installed Windows HOST modules ran over loopback mutual TLS with a synthetic WARP
    surface and X-Plane fixture. Seven distinct H.264 pictures at 512x512 passed independent
    decoding with 2527 luma checks, while all six topics contributed 175 valid samples.
    Freeze held picture 3 for 650 ms after its acknowledgement while 42 telemetry samples arrived.
    Resume produced picture 4. Stopping display closed both picture sockets, refused reuse of
    the expired token and allowed 44 more telemetry samples before telemetry Stop.
    The distribution restricted the source to DISPLAY2. No user desktop was captured.
  evidence: "ws:evidence/build/magnifier-picker-feedback/mixed-release-host/result.json"
limitations:
  - Completion timing came from the software receiver. The H.264 tail varied with local encoder time.
  - The cursor clock uses GetTickCount64 divided into 10 ms slots. Values in the same OS timer tick may report a zero difference.
  - Physical picker behavior, Wi-Fi loading, LCD frame rate, p95 optical latency and HID responsiveness under image traffic require HIL.
