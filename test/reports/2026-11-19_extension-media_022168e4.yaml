  - test_id: MAG-13/native-viewport and MAG-05/USB-service-under-local-media
    result: PARTIAL_VERIFIED_HW
    firmware_sha256: "ccc6a04b2eb89d06ff1a580cdebf601c7066c8184133607a8bd9c7f9cd3d3d3e"
    observed: >-
      At boot 388 the submitted 1024x600 RGB565 frame matched all 262144 native viewport
      pixels at (24,60), all 2052 guard pixels and the header controls. Each of six
      codec runs checked two fixture CRCs and completed all 20 measured pictures.
      For requests of 5 then 10 fps, JPEG 512x512 displayed 4.093 and 4.093 fps,
      H.264 512x512 displayed 3.257 and 3.275 fps, and Cinepak 960x540 displayed
      4.786 and 5.100 fps. No chart reported a missed scanout. Over the six windows
      the longest USB service gap was 13.901 ms and the maximum time from a queued
      service request to its callback was 3.937 ms. At idle these values were 10.168
      and 0.078 ms. No USB link change or accepted input was recorded. Idle USB
      completed three background reports in six seconds.
    method: >-
      Local two-phase charts exercised the device decoder and LCD. JPEG and H.264
      reserved 131072 bytes of modeled transport memory. Service windows include
      startup and both validation pictures. The host supplied no desktop pixels.
    open: "Wireless throughput, input-to-host latency with actual input, optical output and sustained operation."
    evidence:
      - "hardware/20261120-magnifier-cadence-ccc6a04b2eb8.png"
      - "hardware/20261120-magnifier-cadence-ccc6a04b2eb8.cadence.json"
      - "hardware/20261120-magnifier-cadence-ccc6a04b2eb8.pattern.log"

