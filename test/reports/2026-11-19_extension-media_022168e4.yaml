    result: PASS_SW
    platform: Production LVGL presenter on a simulated 1024x600 panel, actual host H.264 and Cinepak decoders
    observed: >-
      The presenter copied the borrowed region with its KVS slot. The caller then changed its
      coordinate variable. The rendered 512x512 H.264 picture retained the original negative
      cursor coordinates and source origin, actual size and padding. The top bar marked the
      edge on both H.264 and 960x540 Cinepak. The native image CRC remained unchanged.
