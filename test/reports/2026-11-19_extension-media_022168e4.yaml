  - test_id: TECH-078/081/optional-flash-runtime-host
    result: PASS
    steps: >-
      Run six fresh 32-bit Windows processes with the firmware language worker, partition parser,
      read-only VFS, streamed font loader, LVGL 9.6 and both AOSP decoders. Supply the two single-language
      flash images above, the existing combined ime_data4b.bin, and a run without a partition.
      In two processes flip one dictionary byte in memory before mount.
    observed:
      - "With both languages disabled, 15 sync calls produced zero workers, partition lookups, reads and tracked allocations."
      - >-
        All three entries verified in each single-language image. Requesting both languages attached only
        the available engine. The combined image verified five entries and converted both languages.
        Pinyin converted nihao to 你好, and OpenWnn converted nihongo to 日本語. LVGL streamed each
        candidate glyph from its own font. The rasterized glyphs had 241, 220 and 171, 204, 315 nonzero
        pixels respectively, with the same pixel hashes on the single-language and combined images.
      - >-
        Disable during a pending load was reconciled on the next owner poll. Three enable, search
        and disable cycles closed the decoder each time. The previously published font still drew a
        glyph after each detach. Tracked allocations returned to the cached font tables, 156404 bytes
        for Chinese and 68140 bytes for Japanese. Each corrupted image verified two entries out of
        three and the loader refused to attach the affected decoder.
    scope: >-
      Host adapters supplied partition bytes, Windows SHA-256, deterministic worker scheduling and
      UI attachment callbacks. Pinyin read a temporary stdio file copied through the registered VFS.
      Widget interaction, physical flash timings and ESP32-S3 free or low-water heap with media remain
      outside this measurement.
    evidence:
      - "build/adr042-flash-host/src/run.py"
      - "build/adr042-flash-host/run.log sha256=20b33e8d0f14a6e958132236f86f963d300017b5e18c122e9021b6068c14a211"

