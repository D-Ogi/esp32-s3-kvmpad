      geometry, and a new session with a legacy frame presented the image without any edge label.
      The three independent LVGL runs also exercised Stop, Freeze, stale media and card playback.
    evidence: [build/magnifier-region/display-1.log, build/magnifier-region/display-2.log, build/magnifier-region/display-3.log]
    open: Physical Windows picker, display topology and observation of the resulting LCD picture.
  - test_id: MAG-13/lossless-panel-fixture
    result: PASS_SW
    platform: Desktop LVGL 1024x600 under AddressSanitizer, plus ESP32-S3 Xtensa compilation
    steps: >-
      Open the engineering command ui media-pattern from Home. The presenter publishes one
      local 512x512 RGB565 surface, hides the sharing controls and shows CAPTURE OFF, Test pattern,
      Stop and Home. The command ui media-pattern-scan compares the known rectangle with each
      available LCD framebuffer after the LVGL refresh and reports bitmasks and VSYNC/bounce deltas.
      The HIL runner requests ui media-pattern-snap. The LVGL task checks the active chart,
      framebuffer match and scanout counters immediately before rendering the native snapshot.
      The runner verifies the ordered rows, RGB565 hash, pixels and text, closes the chart
      and checks that the product shell is active before saving a PNG.
    observed: >-
      All 262144 viewport pixels matched the independent RGB565 reference at (24,60) through
      (535,571). The surrounding 2052 pixels were black. Separate glyph-mask references matched
      the status and both buttons. The checker rejected a one-pixel shift, resampling, one damaged
      pixel, paint beyond the right edge and each of three obscured header regions. Both buttons
      returned to the prior screen. Memory refusal left it usable. The scan test distinguished a
      stalled scanout, no matching buffer, and a match only in the second buffer.
      The guarded snapshot refused a different view before allocating pixels or emitting rows.
      A serial replay of the desktop output reproduced all 614400 pixels and hash 1E89584A.
      Six incomplete, corrupted or unverified replay variants were rejected.
    budget: One immutable 524288-byte PSRAM surface in the engineering image. No decoder or stream queue.
    limits: >-
      The PNG is a desktop LVGL render. The ESP32-S3 compilation covered media_panel.c, ui_shell.c and
      kvm_console.c with and without the diagnostic flag. The chart start, scan and snapshot
      commands are compiled only in the engineering configuration. Physical framebuffer and
      optical evidence require a board run.
    evidence: [build/mag13-pattern/desktop-lvgl.png, build/mag13-pattern/desktop.log, build/mag13-pattern/checker.log, build/mag13-pattern/snapshot-guard.log, build/mag13-pattern/runner-replay.log, build/mag13-xtensa/build.log]
  - test_id: EXT-063/MAG-01/MAG-07 magnifier settings and display freshness
    result: PASS_SW
    scope: Real LVGL 9.6, host H.264 and Cinepak decoders, synthetic fixture, simulated transport callbacks and display.
    observed: >-
      All three package crop modes reached the capture settings and the requested mode matched
      the selected state. Opening settings did not start a stream. The panel allowed eight
      simulated seconds for review without starting the six-second picture deadline. After
      the data channel bound it expired a stream with no first picture. A completed image
      reported receiver-to-display time. Further pictures produced an observed frame rate.
      A 1.6-second pause marked the last picture stale and a new valid picture restored the display.
      Freeze held the picture for eight simulated seconds. Resume restarted the measurement.
      A stream carrying CRC-valid but undecodable image payloads lost its last visible image.
      Monitor cleared a previously decoded H.264 image before another session could start.
      A fresh request reused the stream ID in a new epoch and a delayed close on the old
      epoch left the new pixels intact. Stop and Home remained available.
    evidence: [build/magnifier-mode/installed.log, build/magnifier-freshness/monitor-1.log, build/magnifier-freshness/monitor-3.log]
    open: Physical pairing, Windows picker approval, capture-to-panel latency and monitor switching on unit 1.
  - test_id: MAG-05/mixed-input-software
    result: PASS_SW
    platform: Windows x64, AddressSanitizer, LVGL 1024x600, simulated three-interface USB sink and file-backed synthetic H.264
    source: >-
      The production panel runs live decode at FreeRTOS priority 2 and releases its media queue
      mutex before decoding. The firmware selects the TinyUSB default task priority of 5. Its
      completion callback polls the HID scheduler immediately. The host test runs the actual
      panel worker, message receiver, queue, decoder, HID dispatcher and HID core. Its USB sink
      and clock model one host poll per millisecond. It replaces the firmware task and queue primitives.
    steps: >-
      Build test/live_view/build_checks.py with --hid-load and --lvgl. Invoke panel_test --hid-load
      with the synthetic idr-message.bin from check_live_worker.py. Compare the same input sequence
      before opening the media panel and while holding the first decoded picture before publication.
      Submit ten CRC-checked 96 KiB access units at 100 ms model intervals. Nine more units reach the
      pending slot while the decoder retains its first frame. Press the LVGL Stop button with one
      keyboard report in flight and 64 queued input intents.
    observed: >-
      Ten independent runs matched the baseline for all 207 completion offsets, report lengths,
      interfaces and bytes. Each of 200 ordinary keyboard and mouse reports completed one model
      poll after posting. Queue overflow and explicit release neutralized the keyboard within two
      polls of Stop with no stale queued presses. The late decoded picture did not reopen the panel.
      A fresh message with the same negotiated stream ID was rejected under the closed epoch and
      accepted under the next epoch.
    open: >-
      Measure actual input-to-USB latency and frame delivery under Wi-Fi capture on the physical
      board. The modeled poll offsets supply no measurement of ESP32 scheduling delays.
    evidence: [build/mag05-hid/run-1.log, build/mag05-hid/run-10.log, build/mag05-hid/panel-regression.log]
