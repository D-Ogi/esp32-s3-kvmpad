  - test_id: KEP-FR-006/007 and PACK-015 simultaneous telemetry and magnifier
    status: PASS_SW
    observation: >-
      The COMPOSITE profile may open two independently approved scopes for the same enrolled
      board and profile. The real C workers and Python HOST were linked over local mutual TLS
      using simulated ESP transport, capture and data providers. Samples continued while the
      image waited for LCD credit, after a display-only stop and during a second capture.
      A wrong profile or epoch could not stop the display. Home stopped both workers.
      The same tests pressed Start before the first HELLO. An old HOST policy close
      selected exclusive operation; early navigation skipped the redundant telemetry prompt.
    host: >-
      All 37 HOST tests passed. The real Windows capture and JPEG encoder used a synthetic
      D3D11 surface while six simulated X-Plane topics published values. The ninth JPEG
      arrived after stopping telemetry. Physical USB latency during streaming remains open.
    scope: >-
      The real LVGL pack renderer checked local capture permissions on handoff and continued
      to release USB controls. Physical touch, Wi-Fi, simulator feeds and LCD latency are pending.
    evidence: [build/composite-device/loopback.log, build/composite-device/views.log, build/composite-device/views-build.log, build/composite-host/host-tests.log]
  - test_id: KEP-FR-002/006/007 and EXT-050/060 authored profiles with scoped HOST sessions
    status: PASS_SW
    implementation: >-
      The firmware carries the installed manifest ID to the foreground HOST approval and requests
      only the profile's declared simulator topics, deduplicated by name. A custom capture or
      telemetry session requires the matching echoed scope. Existing instruments, magnifier and
      physical Studio handshakes retain their original identities and operation limits. Measurement
      age includes the HOST age and elapsed receiver time. Repeated timestamps retain their age.
    installer: >-
      A custom COMPOSITE package declared a pitch gauge, local controls and a magnifier. The real
      LVGL installer staged the archive from the simulated card and from the paired receive window.
      Each route exercised five openings with optional capture denied, granted, retained, revoked
      and denied again. The telemetry boundary saw only pitch. Every allowed magnifier handoff
      retained the package ID and stopped its exclusive telemetry session on leaving the controls.
      On the separate production media panel all three crop modes requested the originating ID.
    wire: >-
      The native build of the production C bridge generated every nonempty subset of the six
      simulator channels. All 63 went through the Windows HOST over loopback mutual TLS. The C
      client parsed the actual session and subscription replies, generated BIND with the HOST's
      token, and processed 384 telemetry messages. Consent used the same custom ID in all 63
      sessions. C fixtures checked unrequested topics, source age, wrap, a legacy repeated
      timestamp, STOP and missing or wrong scope echoes. The 25 Windows HOST tests included
      separate authored capture and telemetry sessions, denial, reserved IDs and wrong operations.
    scope: >-
      Windows ran the broker with temporary identities and synthetic data. ESP32 network transport,
      card, touch input and consent decisions were simulated. A paired physical board and simulator
      remain necessary for on-device acceptance.
    evidence: [build/pack-host-scopes/card-panel.log, build/pack-host-scopes/views-test.log, build/pack-host-scopes/panel-status.log, build/pack-host-scopes/wire.log, build/pack-host-scopes/c-wire-loopback.log, build/pack-host-scopes/host-with-native.log]
