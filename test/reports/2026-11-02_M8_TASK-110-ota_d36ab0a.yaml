risks:
  - "The LVGL health probe relies on LV_USE_PERF_MONITOR=1. Without it, LVGL pauses the refresh timer on a static screen, refr_cycles stops and the fixed heartbeat would roll back a good image. A release build without the perf monitor needs another LVGL liveness counter."
  - "A CJK glyph draw now waits for the flash driver during an erase, so the candidate strip can lag during an OTA download."
