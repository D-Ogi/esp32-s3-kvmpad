  - test_id: TASK-110-ota-row1-crash
    <<: *common
    result: FAIL
    evidence: "evidence/hardware/20261102-185147-ota-row1.log sha256=584e6db7e5534fe2f16cf8fe2ecbbdfbe23d86354807e1a1a4fdf1b395301651"
    observed: >-
      Plan row 1 (EN reset at 50 % of RECEIVE) never reached its trigger. The board panicked at the first flash write
      of the download (server: client gone after 65,536 of 2,887,680 B): "Cache disabled but cached memory region
      accessed" in lcd_rgb_panel_fill_bounce_buffer from the GDMA interrupt, while the OTA task was in
      spi_flash_op_block_func. Cause: permanent mappings of ime_data (IME fonts and OpenWnn dictionaries). With XIP from
      PSRAM, ESP-IDF disables the cache for every flash write while any mapping exists. The same path is taken by NVS
      writes. The series stopped at the first unexpected reset. Fixed by ADR-034 (PROPOSED): no permanent flash mappings.
  - test_id: ADR-034-host
    <<: *common
    result: PASS
    steps: |
      cmake --build ../build-host-uicomp && ctest --test-dir ../build-host-uicomp   (-DKVM_HANZI_BLOB=../build-ime-data/font_hanzi_24_v2.bin)
      cmake --build ../build-sim && ../build-sim/kvm_sim.exe
      ctest in ../build-host-views and ../build-host-ui
    observed: >-
      test_ui_font_blob 39,752 checks, 0 failures; ui_components 5/5. Every blob of the suite (damage table, every
      truncation, 3,000 plain and 3,000 compressed random corruptions) goes through the in-place and the streamed
      loader: the same status, the same pixels for every sample glyph, no read outside the blob, nothing left
      allocated. Every read and allocation of an open fails once in turn and is refused cleanly. The real hanzi blob
      streamed: 4 parts, 16,580 glyphs, 156,468 B of tables, 602 reads to open, the same pixels as in place over 4,096
      sampled code points. kvm_sim PASS (43 goldens, unchanged); views 7/7, ui 3/3.
