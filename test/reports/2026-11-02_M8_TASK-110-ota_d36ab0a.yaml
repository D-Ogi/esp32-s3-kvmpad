      kvm_ota_heartbeat_alive() (update_health.c) is alive only after the counter moved since the first sample; host
      tests reproduce the board case (frozen touch counter -> TIMEOUT, missing 0x2) - test_update_health 103 checks,
      0 failures; images rebuilt. Re-run on the board in series 2 below (AT-FAULT-08-row1..6: PASS_HW).
