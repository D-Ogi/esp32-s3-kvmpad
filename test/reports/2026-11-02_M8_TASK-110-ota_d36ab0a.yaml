      restart), then rst:0x10 once with every restart routed to core 0. The routing change was reverted. In every
      rst:0x10 log nothing is printed between "rebooting" and the final ROM banner. 10 board resets used.
    next: >-
      External reports of the same symptom on ESP32-S3 boards with a 7-inch RGB panel point at the LCD_CAM scan-out
      still running through the restart: esp_restart_noos resets GDMA but not LCD_CAM. One report measured 4/10
      watchdog resets without a fix and 0/10 with LCD_CAM stopped and reset in a shutdown handler (Wi-Fi off did not
      help) (github.com/ericdahl-dev/phrasedeck/issues/150; similar: github.com/prestonbrown/helixscreen/issues/1752).
