# M8 / TASK-110, signed OTA on board #1 (ADR-031 plan, docs/OTA.md), first session. Development key (RSA-3072, kept
# outside the repository), signed app images without secure boot (no eFuse touched), three test images built with
# the workspace script .tools/build-ota-set.ps1: A (wired), B (good update), C (no touch reader: must roll back). A
# development server certificate is pinned only in these test builds (KVM_OTA_TEST_CERT). The session stopped at the
# 15-reset budget. Findings: an OTA write crash (fixed, ADR-034) and a health check that confirmed image C (fixed).
# Series 2 (a new budget after the fix) ran every row of the plan on the board: all PASS_HW.
# Format: docs/spec/04 section 12. Raw logs: ../evidence/hardware/ (outside the repository).
