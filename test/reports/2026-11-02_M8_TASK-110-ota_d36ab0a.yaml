      evidence/hardware/20261102-201713-rb-core1-r.log sha256=bbc44999a6073064ae3c211c1b8d18b901e7f36f8e39cb9bbca445e28c0b78ed
      evidence/hardware/20261102-201722-rb-core0-r.log sha256=56ceaf3aa00ff069d4a4e9a62f9023a674a2f47d7d5d0e99dc8f285dfc042a42
      evidence/hardware/20261102-202131-rb-fixed-1.log sha256=401e20f5964e682b45cd3632882e240676a947eab4910e289c24e103af0363f4
    observed: >-
      Hypothesis "only a restart called on the APP CPU hangs" (the console task has no core affinity, and the IDF
      restart path differs per core) is refuted. esp_restart() from a task pinned to core 1: rst:0x10 twice, a clean
