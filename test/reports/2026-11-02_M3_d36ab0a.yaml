    issues:
      - "The first stress run found accepted shortcuts that were still queued at RELEASE_ALL ending with no outcome event (10000 accepted, 9768 delivered + aborted). Fixed: queued or stale shortcuts now raise CHORD_ABORTED; the suite asserts delivered + aborted == accepted."
      - "A single int16 delta of -32768 was clipped by the coalescing cap (32767). The cap is now 32768."
  - test_id: AT-HID-03   # 6KRO, rollover rejected gracefully
