requirements: [EXT-011, EXT-020, PACK-016]
source: local changes on 022168e4
evidence_root: ../evidence/build/hpe-pack-signing
tests:
  - name: Provisioned ESP32-S3 application
    result: PASS
    evidence: [configure.log, compile.log, sign.log, verify.log]
    image_sha256: f238aca78088997ad6f060257a708213b225fcb2e630b56c8be09e9fbeaa3cd9
    image_bytes: 3477504
    slot_bytes_free: 716800
    observed: >-
      ESP-IDF v6.1 with size optimization, FFmpeg and the normal product entry points linked the Ed25519 checker,
      then generated the signed application. An offline comparison against the public boot key from the original
      OTA0 verified the RSA signature. The image contained the provisioned ephemeral Ed25519 key and signature
      domain separator. The board retained its existing firmware throughout.
  - name: Desktop to firmware and A/B recovery
    result: PASS
    evidence: native.log
    observed: >-
      The desktop packager signed a checklist with each of two ephemeral publishers. The production C archive,
      integrity, scene and Ed25519 implementations admitted both and reported the expected public key fingerprint.
      The selected package survived installation and A/B recovery. An empty trust set refused it on recovery.
      Both configurations accepted an unsigned checklist for local review. A different signer, a changed UI with
      recomputed inventory, noncanonical scalars, malformed signatures and a forgery for a low-order key were rejected.
      Native tests used OpenSSL for SHA-256/SHA-512 and the firmware's portable group arithmetic for Ed25519.
  - name: Portable Ed25519 verification
    result: PASS
    evidence: equation.log
    observed: >-
      The firmware group implementation verified the first RFC 8032 section 7.1 vector and 96 fresh signatures
      over messages of different lengths. It rejected 288 mutations to signatures, messages and public keys.
  - name: Existing desktop authoring suite
    result: PASS
    evidence: desktop.log
    observed: All 16 tests passed.
  - name: Publisher indication on the consent screen
    result: PASS
    evidence: ../../2026-11-19-publisher-review-layout.log
    observed: >-
      Headless LVGL at 1024 by 600 displayed the full SHA-256 fingerprint for a verified scene and the unsigned
      label for a local scene. Controls remained below the fingerprint.
scope:
  - The accepted signed payload set comprises manifest.json, ui.json and bindings.json.
  - The device recomputes each digest from decompressed bytes and requires the matching size in integrity.json.
  - Publisher keys are compiled into the application from an external PEM bundle. Updating trust requires a firmware image.
  - Tests used ephemeral public keys. Physical package installation and publisher review on a provisioned board remain open.
