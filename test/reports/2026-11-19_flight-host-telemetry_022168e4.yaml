  scope: "Headless LVGL, offline SDK preview and an isolated ESP32-S3 compilation of pack_panel.c."
  result: >
    Tested portrait and landscape, all eight combinations of joystick, telemetry and capture
    capabilities, and both Home and the extension screen switcher. All 32 layouts fit.
    Pilot Panel showed its title alone while idle. An active capture on the system appeared
    even in a local-only profile, then disappeared when sharing stopped. USB suspend,
    stale telemetry and data errors remained visible in profiles using those capabilities.
    Local-only profiles made no USB snapshot or telemetry sample reads.
