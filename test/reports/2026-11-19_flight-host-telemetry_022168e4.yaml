four_quality_followup:
  result: PASS_SW
  spec_basis: >-
    Section 15.3 defines VALID, STALE, UNAVAILABLE and ERROR. Section 17.2 maps an unknown
    X-Plane path to UNAVAILABLE. Section 17.6 illustrates a three-state MCU API, prompting
    explicit capability negotiation with older peers.
  contract: >-
    A telemetry SESSION advertises quality_v=1. SUBSCRIBE opts in and SUBSCRIBED echoes
    that version. A provider fault has quality ERROR and a null value. A legacy receiver
    receives UNAVAILABLE/null. No fault is delivered as an instrument value of zero.
  semantics:
    - Invalid scalar, malformed successful response or explicit provider error invalidates only the affected topics.
    - A SimConnect exception invalidates all readings requested in that response; the helper can reopen.
    - X-Plane timeout, simulator shutdown and connection loss age the previous observation. A missing DataRef is immediately UNAVAILABLE.
    - A last good value becomes STALE at one second. ERROR remains a fault until recovery or expiry at three seconds.
    - The next valid measurement restores its instrument and resets smoothing. Link loss or Stop clears the cache.
  software_proofs:
    - >-
      Production host.main used loopback mTLS and the real X-Plane HTTP adapter and MSFS native read
      helper. A corrupt roll sample left five valid instruments running. Explicit HTTP 500 and
      SimConnect exception packets marked all six ERROR. HTTP 404 became UNAVAILABLE. Each source
      recovered, then ordinary source loss yielded STALE at 1017–1084 ms and UNAVAILABLE at 3014–3064 ms.
    - >-
      The separately compiled production bridge.c worker ran its HELLO, SUBSCRIBE, BIND, sample
      parser, cache and Stop through a host OS mTLS WebSocket shim. Both session variants passed.
      ERROR survived age 1000 ms while the previously valid peer instrument became STALE. Both
      expired at 3000 ms. Negotiated ERROR with a numeric value and unnegotiated ERROR/null
      each terminated the session and cleared both samples.
    - >-
      The real LVGL Flight Instruments scene displayed Data error on IAS, altitude and the horizon,
      then Unavailable and recovered. The typed text fixture verified fault text, cleared readings
      and low-pass/hysteresis recovery. The system status row prioritized an erroneous roll
      alongside stale pitch and recovered to Data live on both local and paired installation paths.
      These native LVGL runs used ASan and UBSan.
    - >-
      All 33 Windows HOST regressions passed. Invalid quality versions were rejected without
      invoking approval. Reaping a helper that exits with a pending write tolerated the Windows
      pipe-close error and allowed re-opening the simulator.
  hil: NOT_RUN
  limits: >-
    Public simulator data, provider errors, physical grants and task/transport platform APIs
    were represented by deterministic fixtures. The provider checks used a SimConnect SDK
    substitute. Real simulator behavior, radio and physical panel timing remain unmeasured.
  evidence:
    - build/flight-quality/telemetry.json
    - build/flight-quality/telemetry.log
    - build/flight-quality/c-worker.log
    - build/flight-quality/instruments.log
    - build/flight-quality/instruments-error.png
    - build/flight-quality/typed-quality.log
    - build/flight-quality/aggregate.log
    - build/flight-quality/host-regressions.log
    - build/flight-quality/SHA256SUMS
