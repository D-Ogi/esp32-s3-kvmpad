test_id: FLIGHT-05/FLIGHT-06/BRIDGE-04
result: PASS_SW
spec: "Extension platform v1.3.1 sections 15.3 and 17.2, Flight Instruments public package"
evidence_root: ../evidence
production: Windows HOST main, mutual TLS/WSS, broker, subscriber, X-Plane HTTP adapter and native MSFS helper
fixtures: >-
  Private loopback HTTP and WSS endpoints, temporary certificates, explicit fixture consent and a software
  board peer. X-Plane served named REST DataRefs. Production msfs.cpp was compiled with a test API for
  SimConnect that checked SimVar names, units and request definitions. Only the test implementation supplied
  the raw sample values. A production SDK build and real simulators are separate qualifications.
checks:
  - Six canonical topic names, sequence progression, heading wrap, pitch and bank signs, source and units.
  - 10 Hz requested per instrument and 20 Hz per attitude channel; cadence counted distinct source timestamps.
  - Two-second live window with X-Plane IAS artificially delayed by 180 ms, kept independent of attitude.
  - Per-topic transitions to STALE with the previous reading and UNAVAILABLE with null; all recovered on restart.
  - Full six-variable scope before and after source loss, then an independent altitude-and-roll-only grant.
  - No provider reads before the scoped decision, only those two SimVars/DataRefs after it, including a second restart.
  - Numeric IDs re-resolved on X-Plane source restart; source reads stopped after foreground Stop.
  - Non-finite, unrepresentable and boolean values could not refresh the retained sample.
