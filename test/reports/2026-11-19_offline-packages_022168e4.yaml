  - name: Active extension survives an interrupted update when validation is temporarily unavailable
    result: PASS_SW
    platform: Production package loader and two-slot store on Windows, LVGL pointer input at 1024x600
    observed: >-
      Six faults were injected during both review and staging. They covered the package directory
      hash, member hash, PNG allocation, publisher allocation, signature hash and publisher
      fingerprint. All 12 cases preserved every installed slot file byte for byte. A fresh process
      recovered 1.0.0 after interruption and again after tentative staging. Retrying and confirming
      installed 2.0.0. Packages with incorrect digests or signatures and malformed PNGs were rejected.
      A separate file-position error during staging preserved the installed archive.
    ui: >-
      Nine pointer-driven attempts covered a first install, card removal, a file-position error,
      three timeouts updating an extension and three timeouts reopening an installed version.
      The Home message named version 1.0.0 only when the card worker recovered it as a different
      installed revision. After the third failure, the affected version was disabled and 1.0.0
      opened from Installed extensions and responded to the checklist button.
    limits: The filesystem, removal, input and interrupted display refresh were simulated.
    evidence:
      - build/pack-update-recovery/before.log
      - build/pack-update-recovery/before-assets.log
      - build/pack-update-recovery/final.log
      - build/pack-update-recovery/ui.log

