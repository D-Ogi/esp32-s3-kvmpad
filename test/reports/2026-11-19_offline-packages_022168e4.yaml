tests:
  - name: Interrupted uninstall, reinstall and first refresh deadline
    result: PASS_SW
    observed: >-
      The previous firmware reported disabled=1 for a fresh review after an interrupted uninstall.
      With the fix, the native firmware store and desktop storage implementation each passed eight
      interruption points. Each reinstalled the same archive at generation one, preserved an unrelated
      file and quarantined the new installation only after three new failures. In fourteen before/after
      LVGL runs, a first refresh at 4.999999 seconds passed even when the worker resumed at 5.3 seconds.
      A first refresh at or after five seconds preserved the previous generation with the fix.
      The release image passed signature verification and the four-interface USB descriptor check.
    firmware_sha256: acb4c621a05b03c0b6cdfdc48b902cf814d1b73e40e44e7a7432bfba84e7535c
    limits: Physical microSD power-cut validation and LCD validation of this image are pending.
    evidence:
      - build/pack-reinstall-cleanup/before.log
      - build/pack-reinstall-cleanup/device.log
      - build/pack-reinstall-cleanup/sdk-verify.log
      - build/pack-reinstall-cleanup/signature.log
      - build/pack-reinstall-cleanup/descriptors.log
      - build/pack-trial-deadline/results.json

