  - name: Paired Studio and HOST address refresh and FR-723 manual Windows connection
    result: PASS_SW
    observed: >-
      The installer and standalone HOST resolve the selected DNS-SD instance before connecting.
      Discovery can replace the host and port while retaining the saved key, certificate pin,
      token and pairing date. Tests covered old instance aliases, an unrelated board with the
      same display name, an unavailable discovery service and the saved address fallback.
      The Advanced dialog accepts IPv4, IPv6 or a host name and a separate port. A saved board
      uses its existing pairing. Selecting a new board at a manual address opened the same
      six-digit PIN dialog as discovery. Cancelling it left the test store untouched.
      The Windows dialog checks passed in light and dark modes. All 45 selected discovery and
      package transfer tests passed, including the native package receiver.
    physical: >-
      The production Windows browser found one mDNS instance matching the one saved CLIENT
      pairing, advertising v1 on port 8443. A fresh installer attempt after discovery received
      a TCP refusal before the transfer phase. The Windows session uses a system proxy for
      the advertised HTTPS endpoint. Its role in the refusal was not established.
    limits: >-
      This run did not complete a physical package installation or a new manual pairing.
      The full client suite passed 330 tests, skipped three and reproduced the two previously
      recorded failures in loopback TLS handshakes.
    evidence:
