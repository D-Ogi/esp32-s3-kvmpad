  - name: Section 18.3 activation health and firmware Home recovery
    result: PASS
    rule: >-
      Three scene initialization failures or first-presentation timeouts for the same package SHA-256
      in a rolling 120-second window disable that revision. Seconds come from the monotonic boot clock.
      A new boot starts a new partial window. A confirmed presentation clears previous strikes for
      those exact bytes. The disabled state remains on the card across power cycles.
    storage: >-
      Each profile has two bounded health entries and two alternating 96-byte records per entry.
      Sequence and CRC select a complete record after an interrupted write. Each entry retains
      a disabled digest separately from the pending strikes. When both entries are occupied, a
      later third-strike decision may replace a previous disabled digest. An explicit uninstall
      removes the health records. Existing cards with no records continue to use their original
      A/B indexes. Recovery skips a disabled digest even if interruption leaves its published index.
    observed: >-
      Native storage tests checked window expiry, sliding-window overlap, a fresh boot, success
      between failures, refusal to restage quarantined bytes and rollback when the previously
      published version itself failed. Truncating the newest record at each of its 96 byte offsets
      preserved the preceding valid health record and the readable healthy archive.
      In real headless LVGL, three initialization refusals and three independent five-second timeouts
      each returned to firmware Home with the disabled explanation on the third failure.
      The same installer then offered no activation target. Installed extensions still opened the
      earlier version. Home and simulated card removal each left the count unchanged.
    platform: 1024x600 LVGL 9.6, native worker with ASan/UBSan and file-backed card, plus Xtensa compilation
    evidence:
      - build/pack-health-ui/health.log
      - build/pack-health-ui/storage.log
      - build/pack-health-ui/local-regression.log
      - build/pack-health-ui/xtensa.log
