host_tests:
  - suite: HOST attach, detach and restart on the existing authenticated CLIENT session
    result: PASS_SW
    method: Native secure_remote session harness using the production pairing and protocol implementations, a simulated socket peer and an in-memory HOST endpoint.
    observed: >-
      A paired CLIENT attached a HOST at the socket peer's IPv4 address. An unauthenticated
      connection, a request before hello, a caller-supplied address and malformed certificate
      encodings were refused. A second authenticated connection could not detach the active HOST.
      The owner received host.detached, attached a new certificate and port on the same connection,
      and continued to send input under the original approved lease. Replaying the old detach
      left the new HOST attached. Wi-Fi loss, heartbeat expiry, Remote off and unpair revoked
      HOST trust. The simulated USB detach still allowed a HOST attachment over Wi-Fi.
    regression: >-
      The secure session suite passed 434 checks. Five protocol suites passed 1386 checks under
      AddressSanitizer and UndefinedBehaviorSanitizer, followed by 200000 seeded frame inputs
      with zero failures. Five transport sources compiled for both three- and four-interface Xtensa targets.
    evidence:
      session: {path: ../evidence/build/host-session-attach/session.log, sha256: 023c61ffdd4e9e874e722efe623185b5ce3bc8c7c3402b586afc362e649ee2cb}
      protocol: {path: ../evidence/build/host-session-attach/protocol-direct.log, sha256: f4dfca05833342c5ed2e6108d8a0f893f75b512d5300614117c540e263c1577b}
      xtensa: {path: ../evidence/build/host-session-attach/xtensa.log, sha256: 76874d7e72599780e7037b2aa5c29b34d01938dc1a8ec7948471929f41730333}
  - suite: test/usb_device/check_session.py
    result: PASS
    command: "python -I -X utf8 test/usb_device/check_session.py --cc x86_64-w64-mingw32-clang --out BUILD_DIR"
    requirements: "08 HPE-INV-05/06, 09 sections 5.4 and 8, 12 CORE-03/07 and USB-D08"
    method: >-
      A memory-backed full-speed controller runs the pinned TinyUSB device core and HID class, firmware USB callbacks,
      dispatcher and input arbiter. The host submits SETUP, DATA and status stages and controls interrupt completions.
    results: >-
      Both interface counts revoked a granted lease on BUS_RESET while one key was held and a second queued behind
      its outstanding IN transfer. An approval waiting behind the reset received a refusal. The next configuration
      sent a neutral keyboard report, rejected the former lease and accepted fresh local input. SET_CONFIGURATION(0)
      and unplug also cleared state. Suspend/resume retained the LED output and Boot Mouse protocol.
      The four-interface test exercised features 0x11..0x15, including 0x12 with host lengths 1, 64, 65, 256, 257
      and 258. A full read returned the 257 configured bytes in packets of 64, 64, 64, 64 and 1. Disabling the
      native surface released its active contact ID. Mode, selective reporting and latency survived resume and
      returned to 0, 3 and 0 after bus reset. Disabling the reset notification or accepting a stale grant failed
      the corresponding assertion in both builds. The existing 12 host-unit suites also passed.
    reference_link: >-
      The three changed USB and scheduler sources compiled with the reference Xtensa configuration and linked
      with its existing product archives. The resulting ELF contains the HID class reset wrapper and passed
      the three-interface descriptor parser.
    limits: >-
      Software packets exercise the actual stack over simulated endpoints. The unit 1 chart staging log
      confirms mounted USB. Board-connector packet capture, OS handling of a held input across a bus
      reset and physical suspend/resume timing remain open.
    evidence:
      native: {path: ../evidence/build/hpe-usb-reset/native.log, sha256: 738accbf80db1de349fe5228ed380f3920a73328c49a52bb74c0581cb1ad8d8a}
      negative: {path: ../evidence/build/hpe-usb-reset/negative.log, sha256: 384136f99f72a58062f7ca2811cda1335213f12f1f26e9495444fac476ee63c6}
      regression: {path: ../evidence/build/hpe-usb-reset/ctest.log, sha256: f169c6f37ff7006724082dee3e38f40e7cb4b0fe352936ed828b36dde382cfed}
      reference_link: {path: ../evidence/build/hpe-usb-reset/three-link.log, sha256: 0c409e43d0c35c0564e58965d4414a6c5b55969d22a79972a846fcd70a517c61}
  - suite: Surface Dial capture, profile admission and serialized rotation
    result: PASS_SW
    requirements: "08 HPE-INV-02/12, 09 report 0x20, 10 DIAL-001/002/003/004/007, 12 CORE-12"
    environment: "1024x600 LVGL 9.6 pointer, production HPE panel, InputArbiter, scheduler and encoder. A memory sink acknowledged IF3 reports."
    observed: >-
      Clockwise quarter-turn measured +900 tenths of a degree, with the reverse returning
      the sum to zero within one tenth. Fine measured +225. Crossing the signed atan2
      boundary measured +21 tenths. A crossing near zero degrees also stayed within
      20 to 23 tenths. Both a path through the hub and a path outside the rim produced
      zero extra reports on re-entry. Four center presses produced four releases across
      ordinary lift, PRESS_LOST, USB suspend/resume and screen unload, with zero mouse button
      reports. The new screen rejected a late local Radial intent. The target hit area
      now shows the center boundary and the device labels host Radial support unverified.
    regression: >-
      Each of five separately reverted protections triggered its specific assertion.
      All 12 host unit suites passed. The 2000-scan PTP synthetic sensor regression and
      the Studio/Access tests passed. The LVGL allocator measured 17596 live bytes after
      one and 100 profile cycles. Both interface configurations cross-compiled for Xtensa.
    limits: "Real GT911 sampling, physical latency and the Windows Radial Controller menu were outside this run."
    evidence: ../evidence/build/hpe-radial
  - suite: Extension profile system status
    result: PASS_SW
    observed: >-
      Ten install and reopen cycles using the production LVGL profile showed four status
      indicators above the 1024x568 content. USB detach, HOST connect, disconnected telemetry,
      missing samples, individual freshness bounds of 100 and 500 ms, live data and
      active capture updated correctly. All four items were non-clickable.
      Both the card and paired-client install paths passed with the same package.
    evidence: ../evidence/build/pack-profile-status/regression.log
  - suite: EXT-042 Flight Yoke POV and axis response
    result: PASS_SW
    platform: "Production scene compiler, LVGL 9.6 at 1024x600, InputArbiter, scheduler and four-interface serializer; memory-only USB sink."
    observed: >-
      The qualified test configuration delivered IF3 report 0x30 for all eight clockwise hat
      positions. Lift, LVGL PRESS_LOST, disconnect/reconnect and profile exit returned the hat to 8.
      Applying a hat preserved the sampled throttle at 49004. Activation emitted no joystick
      report. The linear profile emitted 32 frames and the inverted cubic profile with a 20 percent
      dead zone emitted 30. The tests checked signed limits, center, wobble and an intermediate
      response. A separately named package, button and action pair exercised the same path.
      Desktop and firmware validators both rejected 15 malformed hat or calibration declarations.
      The SDK preview passed the same eight directions and calibration vectors using Node DOM events.
      Native LVGL resident use for the example was 62565 of its 131072 bytes. Both Xtensa
      configurations compiled pack_scene and pack_view. The joystick qualification default was unchanged.
    limits: >-
      The USB sink and touch input were simulated. Host simulator bindings, physical motion and
      joy.cpl/evtest remain hardware tests. A fresh Chromium preview run was unavailable in this
      session. The distributed PNG was rendered by the real headless LVGL presenter on the PC.
    evidence: ../evidence/build/flight-yoke-input
  - suite: test/ui_touch/check_ptp_pipeline.py
    result: PASS_SW
    requirements: [CORE-05, CORE-07, CORE-08, CORE-09, CORE-15, PTP-001, PTP-005, PTP-V02, PTP-V03]
    path: >-
      Synthetic raw GT911 registers enter the production decoder, touch bridge task, touch router,
      native contact tracker and HID producer queue. The actual dispatcher, serializer,
      scheduler and their USB transport callbacks drive an in-memory four-interface sink.
      The test clock, RTOS queue/task primitives, LVGL pointer adapter and USB peripheral are modeled.
    observed: >-
      At a modeled 13333 microseconds between scans, 2000 reports carried all five contacts.
      All 10000 contact positions and IDs matched the expected values for the Mouse rectangle
      x=20..1003 and y=88..495. Scan time advanced by 133 or 134 units and wrapped four times.
      The suite also exercised the exact 65535-to-zero boundary, reordered sensors and
      last-position liftoffs. On a mixed one-down/four-up report, the next cancellation
      contained one ID after successful completion, five after transfer failure, and one
      after a mode change while the transfer was still in flight. Asynchronous feature,
      failure and release events use the dispatcher clock when emitting all-up.
      A new ready scan after a gap over 120 ms, a silent sensor and duplicate IDs each
      cancelled the held contact and waited for a full lift. A chrome contact reached only
      the local pointer. The scheduler refused native contact frames outside the Mouse
      profile, and fallback IF1 movement resumed only after all held fingers lifted.
    controls: >-
      Four separate test binaries each restored one previous defect. All four failed the
