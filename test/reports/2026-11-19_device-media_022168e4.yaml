  scope: "CFR MP4 with one H.264 picture per presentation slot. The decoder preserves the first PTS and source presentation order."
  profiles:
    - {name: rr_blend, enum: KVM_H264_RR_BLEND, kvc1_id: 3, suffix: .kvf}
    - {name: rr_smart_loose, enum: KVM_H264_RR_SMART_LOOSE, kvc1_id: 4, suffix: .kvs}
  reconstruction: >-
    Blend discards non-reference pictures using the H.264 decoder's reference flags. Smart loose
    uses the supplied reference thumbnail comparison and packet PTS to decide when to retain them.
    Missing slots use the reference player's rounded Q8 linear interpolation between adjacent
    decoded pictures, with endpoint holds. Timestamps and display intervals use the source clock.
  bounded_work: >-
    One previous reduced AVBuffer reference, one lazily allocated mixed YUV420p frame and a
    632-entry presentation slot array. The handoff player bounds reconstruction gaps at 600 slots.
    Native framebuffer callbacks borrow the pixels through return. Cancellation is checked at
    every synthesized row and each output. The ordinary FFmpeg arena limits still apply on S3.
  counts:
    columns: [file, frames, blend_decoded, blend_synthesized, smart_loose_decoded, smart_loose_synthesized]
    rows:
