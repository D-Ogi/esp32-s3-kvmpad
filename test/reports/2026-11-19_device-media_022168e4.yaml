  measurement: >-
    Read Xtensa CCOUNT immediately before and after the full USB JPEG decode in QEMU 11.1
    on de233_fpu with icount shift zero. Both variants execute the ESP32-S3 rev0 JPEG ROM
    and its memcpy. The candidate also executes ROM memcmp at 0x4000120c. The output stride
    is 647 RGB565 words. Decoder allocation and test-side pixel checks occur outside the interval.
  columns: [fixture, subsampling, baseline_ccount, candidate_ccount]
  rows:
    - [chart, "4:4:4", 1894415, 1825871]
    - [chart, "4:2:2", 1585845, 1508565]
    - [chart, "4:2:0", 1424381, 1341581]
    - [mixed, "4:4:4", 2038192, 1994896]
