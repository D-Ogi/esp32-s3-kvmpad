    3365 ordered frames and 10095 individual Y/U/V SHA256 digests per ABI. All eight temporal
    profiles matched the supplied decoded/synthesized counts, 2994 plane hashes, 998 absolute PTS
    and 998 display intervals. Stop after the second output returned KVM_PLAY_STOPPED for all eight.
  prepared_oracle: >-
    check_temporal_card.py prepared both profiles for all four MP4s. Production pack_video_open/read
