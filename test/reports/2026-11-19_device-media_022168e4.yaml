  source: "test_1920x1080.h264 at 25 fps, 73 pictures, 960x540 display"
  windows: >-
    Each pair of imports used the same Windows worker entry point and source.
    Median elapsed seconds across two runs per variant were 23.63 to 17.90 in Exact,
    7.87 to 2.97 in Reduced and 8.71 to 3.28 in Large bank. Exact used the stock
    decoder. The other two used the packaged native decoder. All three companion
    digests matched the previous writer. The installed GUI prepared each file,
    cancelled an in-progress Exact import and left the cancellation destination empty.
  data_rate: >-
    From the actual KVC1 records, the three modes require an average of 175174,
    162960 and 171655 bytes per picture. A sustained 25 fps requires respectively
    4.379, 4.074 and 4.291 MB/s of payload. The configured one-bit 20 MHz link
    has a theoretical ceiling of 2.5 MB/s before SD overhead.
  reader: >-
    The Xtensa reader with production compiler flags used 1.666 to 1.757 percent
    fewer simulated clock ticks on the three current 1080p companions. Static pictures
    at 960x540 used 11.434 percent fewer ticks with two surfaces and 12.587 percent
    fewer with one. Text grew by 46 bytes, peak reader stack fell by 16 bytes and
    heap usage matched. Five-mode pixel, CRC and timing checks passed for 630 pictures.
  deployment: "Updated local Windows importer. Signed firmware passed USB descriptor checks. Physical LCD rate on the new reader remains unmeasured."
  evidence:
