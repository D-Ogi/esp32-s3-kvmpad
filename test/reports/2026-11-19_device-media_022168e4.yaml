mp4_reordered_sample_timing:
  source: "The four MP4s from the pinned H.264 handoff ZIP listed above."
  user_path: "Windows Prepare card video, Exact. Exercised the same import_video function that runs after file selection, using local desktop folders."
  reproduced_before: >-
    Stock Exact rejected pan-cut-regenerated.mp4 after its first picture. The source contains
    96 pictures at 24 Hz. Its microsecond track requires both 41666- and 41667-tick samples.
    The parser-free device reader also returned zero sample durations on the other three MP4s,
    causing the cache writer to substitute 41667 us on all 403 pictures.
  fix: >-
    With MP4 composition offsets, the pinned MOV demuxer can leave sample duration unset.
    The device uses adjacent decoding timestamps in its existing sample index. The completed
    index can also supply a final sample interval from the track duration and initial DTS.
    The decoder carries this duration with its compressed picture into presentation order.
    Stock Exact matches each picture's file offset to a streamed packet table with at most
    64 unmatched entries. This also admits ordinary reordered VFR files. The two temporal
    modes continue to enforce their consecutive presentation slots.
  independent_clock_check: >-
    All 499 original MP4 pictures matched local ffprobe's presented PTS and sample durations.
    Bear and flower each use 33367 us per picture and joy uses 33333 us. Pan-cut has 63 samples
    of 41667 us, 32 of 41666 us, and one with no duration in the source. The public decoder
    preserves that unknown duration as zero. Both cache writers retain the 41667 us fallback.
    A synthetic VFR stream matched on 15 pictures, including its 100000 us sample. The separate
    12-picture, millisecond-timebase test matched four 41000 us and eight 42000 us samples.
  card_output:
    file: "pan-cut-regenerated.mp4.kvc"
    size: 16681541
    sha256: "8501928325c1fec02d579c2740b337e81f41d50d0262eb147542eb679860b793"
    result: "Stock Windows import and the freshly built native reader produced byte-identical 96-frame, 640x360 companions. Across all four MP4s, every RGB565 picture, PTS and cached duration matched."
  regression: "Seven desktop import tests passed. All 32 model cases passed, with 3365 frames and 10095 original Y/U/V hashes. The four 640x360 Exact files completed all 161 frames in a 1802240-byte TLSF arena."
  windows_release_gui: >-
    The Release client used by the workspace launcher was rebuilt with the updated reader.
    Its shipped Prepare playback button in Exact mode produced all 96 frames from the original
    pan-cut MP4 with the same 16681541-byte reference cache and an identical copy of the source.
    A temporary local destination was selected. The test did not write the operator card.
  windows_release_gui_evidence: ["ws:build-device-media/card-timing/client-build.log", "ws:build-device-media/card-timing/client-gui.log"]
  scope: "Offline host execution of the production C decoder and desktop import tool. Physical playback speed was outside this run."
  records: ["ws:build-device-media/card-timing/baseline.log", "ws:build-device-media/card-timing/native.log", "ws:build-device-media/card-timing/ffprobe.json", "ws:build-device-media/card-timing/compare.log", "ws:build-device-media/card-timing/stock-package.log", "ws:build-device-media/card-timing/native-package.log", "ws:build-device-media/card-timing/final-tests.log", "ws:build-device-media/card-timing/corpus.log", "ws:build-device-media/card-timing/640.json"]

prepared_card_reader_cpu:
  status: "READY_FOR_HIL"
  source: "Original test_1920x1080.h264, using the same three 73-frame KVC1 companions previously timed on unit 1 at about 2 fps. Each presented picture measures 960x540."
  change: >-
    The worker decompresses each band with the product's existing zlib and a bounded stack allocator.
    One Z_FINISH call uses the output band as its history. On the S3, zlib requested 7120 bytes
    for its state. A four-byte CRC update consumes the reconstructed XOR word as the worker
    writes it. This removes the separate full-picture CRC pass. Each frame initializes its three
    CRC tables on the stack from zlib's existing byte table. The original companions, encoder,
    source SHA-256, frame CRCs and presentation fences all remain compatible.
  method: >-
    Link the original or updated -Os ESP32-S3 pack_video.c and pack_port.c objects, the linked
    product zlib and the original ESP32-S3 mask ROM in QEMU 11.1 de233_fpu. Run the real
    pack_video_read on two 960x540 surfaces, with identical in-memory file reads and a 16 KiB
    caller-owned input window. Use the target CCOUNT register with QEMU instruction-clock shift
    zero. Measure the lowest touched stack byte with a canary. The Python driver checks the
    real source SHA-256; the target times only per-frame reads after opening the companion.
  results:
    columns: ["mode", "frames", "old_ccount", "new_ccount", "reduction_percent"]
    rows:
      - ["Exact", 73, 89591718, 55654893, 37.879]
      - ["Reduced", 73, 87365100, 54137789, 38.033]
      - ["Large bank", 73, 88461752, 55060721, 37.758]
    reader_stack_bytes: {before: 11472, after: 10720}
    reader_heap_bytes_with_worker_window: {before: 48, after: 48}
    zlib_default_allocations: 0
  integrity: >-
    For each spatial mode the host compared every RGB565 byte, CRC and PTS with the original
    H.264 decoder output on one surface, two surfaces and two surfaces with the worker's window.
    Cancellation, a wrong source, damaged CRCs, truncated records and trailing bytes were rejected.
    An odd-width fixture covered all four band encodings, a half-word tail and two-byte-aligned
    destinations. The target checked every frame CRC while reconstructing each original companion.
  interpretation: >-
    These counters measure relative CPU work with in-memory reads. Physical SD transactions,
    PSRAM/cache contention with LCD DMA and completed refresh intervals need a board measurement
    before assigning a new display rate or a blackout result.
  reproduction_from_workspace: |
    python build-device-media/card-speed/build-new.py
    python build-device-media/card-speed/run-matrix.py
    python esp32-s3-kvmpad/test/kvmpack/check_card_buffers.py build-device-media/probe/test_1920x1080.h264 build-device-media/card-timing/final-card-pixels.exe build-device-media/card-speed/host-reader.exe
    python esp32-s3-kvmpad/test/kvmpack/check_card_video.py build-device-media/probe/test_1920x1080.h264 build-device-media/probe/test_1920x1080.h264.kvc build-device-media/card-timing/final-card-pixels.exe build-device-media/card-speed/host-reader.exe build-device-media/card-speed
  target_driver: "test/kvmpack/target_video/check.py accepts two chosen product objects, their SDK build, compiler, ROM, source and companion."
  records: ["ws:build-device-media/card-speed/final/measurements.json", "ws:build-device-media/card-speed/host-pixels.json", "ws:build-device-media/card-speed/host-regression.log"]

prepared_card_refresh_overlap:
  status: "READY_FOR_HIL"
  source: "Original test_1920x1080.h264, 73 Exact pictures at 960x540, existing 12802144-byte KVC1 companion."
  historical_hardware: >-
    Earlier Exact playback on unit 1 completed 72 intervals in 35882362 us, or 2.007 displayed fps.
    The RGB peripheral measured 32.746 Hz in the previous release trial. These measurements predate
    the bounded zlib reader and the scheduling change.
  io_model: >-
    The production S3 pack reader and target Picolibc fdopen/fread, with the product FAT VFS
    fstat block size of zero and an instrumented memory-backed read syscall, made 911 companion
    VFS reads, including EOF, returning 12802144 bytes. The maximum request returned 16384 bytes;
    only one nonempty read returned 512 bytes or fewer. This rules out per-sector application reads.
    On the configured one-bit 20 MHz SD bus, transfer of all companion bytes alone takes at least
    5.121 s. Even if the first picture is preloaded, the remaining records still require at least
    4.953 s of bus time for a 2.880 s source interval. The existing unit logs
    combine SD command latency, decompression, PSRAM contention and LCD work. They do not resolve
    those individual times after the CPU change. A single 30.54 ms refresh per 498.37 ms historical
    interval accounts for 6.1% of that interval in a one-refresh overlap model.
  change: >-
    Previously the worker waited until each LVGL refresh completed before starting the next card
    read. It now starts the read once LVGL selects the previous complete descriptor and releases the
    other RGB565 surface. The selected surface stays immutable throughout drawing. Publication of
    each new CRC and descriptor still waits for completion of the preceding refresh and for the PTS.
    EOF or a later failed read drains the last submitted picture; removal and Stop cancel the wait.
  controlled_test:
    method: >-
      Build the previous and updated presenters against the same ASan LVGL simulator. Use the sizes
      of the first 12 original KVC1 frame records, convert each to milliseconds at the gross SD bus
      ceiling rounded up, and delay each simulated flush by 30 ms. Display a distinct synthetic
      960x540 picture per record and verify the entire selected surface stays intact throughout the
      flush. Alternate the previous and updated binaries over five runs each.
    frames_per_run: 12
    reads_overlapping_previous_flush: {before: 0, after: 11}
    first_to_last_median_us: {before: 1445879, after: 1074582}
    median_reduction_percent: 25.68
    exceptions: "A failed seventh read preserved six complete displays. Card removal at that read returned STOPPED. The ordinary presenter tests passed physical-button callback, card loss, picture accounting and the injected-blackout checks under ASan."
    scope: "The simulator delay is a workload model. Its 25.68% interval reduction is not a physical FPS measurement; actual bus arbitration and LCD DMA remain hardware work."
  native_or_prepared: >-
    At 320x180 source (160x90 display), historic native Exact versus prepared measured
    5.151/5.210, 10.302/10.419, 15.306/15.474 and 16.149/23.577 fps on the 5/10/15/25 fps
    clips. At 640x360 source, prepared Exact completed all four rates. The historical native
    firmware stopped after 12 pictures. Its subsequent memory fix completed all 161 pictures
    in the target-scale tests. A valid companion retains priority in the normal source selection.
  reproduction: "python test/live_view/check_card_pipeline.py --companion ORIGINAL.kvc --serial PREVIOUS-PANEL.exe --updated NEW-PANEL.exe --work SCRATCH"
  records: ["ws:build-device-media/card-io/libc.log", "ws:build-device-media/card-io/trials.json", "ws:build-device-media/card-io/trials/removed.log", "ws:build-device-media/card-io/trials/fail.log", "ws:build-device-media/card-io/full-panel.log", "ws:build-device-media/card-io/target.log", "ws:evidence/hardware/20261119-steady-dual-matrix.log", "ws:evidence/card-video-lower/native-lcd-fps.csv"]
  presenter_continuity:
    result: PASS_SW
    method: >-
      Play the original and its existing card companions through the revised pack_video_read
      and production LVGL panel under AddressSanitizer. The desktop adapter alternates two
      display framebuffers on final flush. Additional whole-screen invalidations exercise
      repaints between picture completions. Each completed picture must match its stored CRC.
    cases: >-
      The 1920x1080 source at 960x540 output passed in Exact, Reduced and Large bank.
      The twelve lower-resolution Exact cases cover 320x180, 640x360 and 960x540 sources
      at 5, 10, 15 and 25 FPS. Counts cover all fifteen runs.
    displayed_frames_matching_crc: 702
    consecutive_lit_pairs: 687
    framebuffer_samples_before_read_overlap: 4646
    framebuffer_samples_with_read_overlap: 19820
    confirmed_or_inferred_black_gaps: 0
    records: ["ws:evidence/build/card-player-continuity/results.log", "ws:evidence/build/card-player-continuity/overlap-results.log"]

h264_display_conversion:
  status: READY_FOR_HIL
  change: >-
    The live H.264 band presenter and native file player share each U/V sample and its color
    terms across a 2x2 block of displayed pixels. Half-size Exact averages each source plane
    before applying the color matrix. Conversion uses the two destination rows directly.
    The file worker checks cancellation between row pairs. Prepared card playback already
    stores RGB565 and bypasses this converter.
  software_conformance: >-
    All 32 spatial and temporal profiles from the handoff reproduced 3,365 pictures and 10,095
    golden Y/U/V plane hashes. The previous and updated native card import readers produced
    byte-identical RGB565 pixels, PTS and durations on all 971,164,800 displayed pixels across
    the same profiles. Independent array arithmetic checked 580 range, matrix, scaling, padded
    stride and odd size cases. Three independent 512-square IDRs and 18 retained-IDR slot swaps
    matched the stock decoder and the independent RGB565 conversion.
  target_measurement: >-
    Compare production ESP32-S3 -Os converter objects under QEMU 11.1, de233_fpu, instruction-clock
    shift zero. For end-to-end file tests, probe a memory-backed MP4, decode with the target
    libavformat/libavcodec archives and a 1,802,240-byte IDF TLSF arena, convert each picture,
    and release the decoder. The live test opens a decoder, retains three IDRs across two slots,
    calls the real four-row renderer 128 times per picture and closes the decoder. The totals
    exclude test-side RGB checksum time. Physical SD, PSRAM contention, Wi-Fi and LCD are outside
    these counters. A new physical frame rate requires a board measurement.
