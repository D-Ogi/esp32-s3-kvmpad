      full-region framebuffer contents and advancing scanout. Physical photon latency
      and end-to-end network throughput were outside this trial.
    controls: >
      The diagnostic accepts only its built-in pattern and returns to the previous screen.
      A host zero-VSYNC/zero-bounce control returned INCONCLUSIVE. The measured firmware
      scheduled each synthetic frame relative to the previous LVGL wake-up. A subsequent
      developer-only change anchors generator deadlines to monotonic time. Trial E
