live_jpeg_mask_rom:
  result: PASS_SW
  target: >-
    Compiled the production kvm_media_decoder_open/frame/close implementation for ESP32-S3
    with Xtensa GCC 15.2.0. QEMU 11.1.0 on a generic de233_fpu Xtensa CPU executed the
    unmodified ESP32-S3 rev0 mask-ROM JPEG instructions. Instruction traces include both
    dispatch stubs and the actual ROM jd_prepare and jd_decomp entry points. The host supplies
    a fixed allocation for the firmware's decoder workspace and RAM for the output surface.
