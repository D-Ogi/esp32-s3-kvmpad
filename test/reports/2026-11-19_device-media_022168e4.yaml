memory:
  units: "bytes"
  measurement: >
    Host x86_64 outstanding allocation request peak across FFmpeg demux, decoder and small
    hash-driver allocation. Allocation headers, fragmentation, stacks, LCD, firmware,
    TLS and RGB565 buffers are additional. Xtensa structure/alignment sizes differ.
    RGB565 bytes below represent the two half-size presentation buffers for the selected file.
    Both reduced banks had identical measured peaks. Target arena admission caps the local
    decoder at 6291456 bytes and leaves at least 65536 bytes outside it, subject to PSRAM
    fragmentation and capacity after canvas allocation. A decode failure discards the staged frame.
  columns: [file, frames, exact_peak, reduced_peak, two_rgb565_buffers]
  rows:
    - [bear.mp4, 82, 13373185, 8346027, 921600]
    - [flower.mp4, 150, 11405261, 6800275, 518400]
    - [john.264, 72, 5129744, 4404947, 921600]
    - [joy.mp4, 171, 24970416, 16220755, 2073600]
    - [motion.264, 72, 5050811, 4326014, 921600]
    - [pan-cut-regenerated.mp4, 96, 10914593, 6930322, 921600]
    - [test_1920x1080.h264, 73, 19326673, 13043410, 2073600]
    - [test_640x360.h264, 73, 2833471, 2075944, 230400]
  analysis: >
    Two 1024x600 RGB565 scanout buffers consume 2457600 of the 8388608 PSRAM bytes,
    leaving at most 5931008 bytes before firmware data, graphics, stacks or fragmentation.
    For test_1920x1080.h264, tracing the supplied reduced backend identified eight
    523344-byte motion-vector arrays, four 783360-byte reduced YUV pictures and a shared
    full-size current-picture buffer of 3139269 bytes. The shared picture and four reduced
    pictures alone total 6272709 bytes. The original 765112-byte H264Context included a
    700448-byte optional film-grain database. Allocating that database on demand and retaining
    only distinct inverse-quant PPS matrices reduced this sample's peak from 14233546 to
    13043410 bytes in reduced mode and from 20516809 to 19326673 in exact mode. The hashes
    above cover these changes. All eight files cannot fit this implementation on the S3.
    Reduced 1080p requires an architectural memory change such as reconstructing the
    current picture using row/border storage and compact or externally backed reference
    and colocated motion data. Exact decoding needs access to native-size references.
  candidates_for_hardware: >
    The smallest handoff file, test_640x360.h264, used 2306344 bytes for reduced decode
    plus its two surfaces in total, before overhead. john.264 and motion.264 require
    5326547 and 5247614 bytes respectively on the same accounting. Only these three
    reduced-mode totals fall below the gross post-scanout maximum. Actual admission also
    depends on the production firmware's available contiguous blocks. The 640x360 original
    plus the 64 KiB arena admission reserve exceeds even the gross post-static/post-scanout
    bound of the Korean-off size-optimized link, using the measured host ABI. An earlier installed
    firmware reported 103144 to 207724 free PSRAM bytes. Its runtime configuration differed.
  live: >
    Live H.264 reserves a 1835008-byte contiguous private arena that includes its two
    native 512x512 YUV presentation references. The retired slot is released before each
    access unit. A stand-alone unregistered encoder-data SEI and access-unit delimiters can
    be omitted before creating the decoder's padded packet. Strips preserve full resolution.
    Cinepak uses 275492 bytes for two validated 960x540 indexed pictures, 196608 for two
    queue slots and a 6144-byte decode stack. Each of the two LVGL draw units can require
    its own 7680-byte RGB565 strip. The adapter retains ownership of its DOUBLE_PARTIAL
    scanout buffers. JPEG uses two native RGB565 buffers and 4096 bytes of ROM workspace.
    WSS receives one message of up to 98336 bytes outside the queue. H.264 arena, queue,
    WSS receive buffer, 32768-byte decode stack, two RGB565 strips and the configured
    16384+4096 plaintext bytes in each of two TLS sessions total at least 2211872 bytes.
    This excludes additional TLS structures, encryption overhead, the network worker,
    LVGL display buffers, other firmware state and allocator fragmentation. Real admission
    requires a sufficiently large contiguous block after the grants and queue allocation.
  card: >
    The device streams the encoded file through a caller-owned FILE. Each fread is capped
    at 8192 bytes, including AVIO direct reads; Annex B geometry probing uses 4096 bytes.
    Seeks must stay inside the same measured file. The MP4 demuxer can allocate indexes
    and individual packet/parser storage inside the bounded decoder arena. Writing reference
    frames to disk would require an additional codec backend. test_1920x1080.h264 is only
    1130868 bytes on card and has 73 single-slice frames (2 I, 71 P), all reference-marked.
    A full reduced YUV420 reference is 777600 bytes. Spilling each would write
    18.6624 MB/s at 24 pictures/s, before reading references, coded input or motion data.
    Native-size references would write 74.6496 MB/s. joy.mp4 uses 86 reference-marked
    slices in 171 frames. The card bus uses one data pin at the driver's default maximum
    20 MHz, or 2.5 MB/s gross. Selective tile caching, compression and reconstruction
    border storage require their own bandwidth and correctness measurements.
  smaller_sources:
    method: >
      Offline derivatives of the supplied 1080p Annex B input. FFmpeg used fps=24, scale
      to the named input size, libx264 baseline, one reference, GOP 24, zero B pictures,
      single encoder thread and yuv420p. These files are separate engineering fixtures;
      the eight original handoff inputs and golden references above were preserved.
    columns: [input_size, display_size, exact_requested_peak, reduced_requested_peak, two_rgb565_buffers]
    rows:
      - [320x180, 160x90, 871486, 825409, 57600]
      - [512x288, 256x144, 1328909, 1217744, 147456]
      - [640x360, 320x180, 1808129, 1615172, 230400]
    interpretation: "24 fps is the encoded input rate. Device presentation throughput for these files remains unmeasured."
paged_original_annex_b:
  source: test_1920x1080.h264
  bytes: 1130868
  sha256: bd5f19433ee786c983099f60b0cada4806c3bb3fd9e74992a8731848dfa62506
  source_format: "1920x1080 Constrained Baseline Annex B, 73 pictures at 25 fps."
  implementation: >
    The pinned RISC-V GCC 15.2 RV32I guest runs the supplied v2 FFmpeg H.264 decoder
    and its original reconstruction functions. The portable C interpreter executes on
    Xtensa. A 32 MiB virtual data space uses a bounded 4096-byte FIFO cache. Dirty
    victims receive compact, once-assigned scratch offsets. Immutable guest code and
    weights are in the signed application. The device receives the original compressed
    bytes from its own already-open card file. This path neither reads the prepared
    .kvc sidecar nor needs a PC decoder. Explicit physical options are Decode reduced
    and Decode large bank. The former uses bilinear rr. The latter selects the
    supplied 65536-byte trained luma bank. Both output 960x540.
  independent_residency_probe:
