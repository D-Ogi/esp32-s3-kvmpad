    method: >-
      The production Xtensa decoder and RGB565 conversion ran in QEMU on two
      encodings of the same 44 source pictures. Both used 640x360, 15 fps, QP 24,
      GOP 15, one reference and no B pictures. The Baseline stream used CAVLC
