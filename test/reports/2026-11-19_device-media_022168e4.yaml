  diagnostic: >
    HIL images enable KVM_MEDIA_SYNTHETIC_DIAG. E incorporates the product-shell
    touch routing fix. F adds typed file allocation errors and the browser memory message.
    The operator can run
    ui media-synthetic 5 30 or ui media-h264-synthetic 5 6. The compiled inputs are
    locally generated patterns. Heap admission logs report internal and external free
    and largest blocks. An unsuccessful decoder allocation also reports its requested
    size, remaining arena bytes and largest allocation. The H.264 fixture was generated
    by test/live_view/generate_synthetic_idr.py and uses two 888-byte baseline IDRs.
reproduce_from_workspace:
  shell: "PowerShell, workspace LLVM-MinGW bin on PATH, ffmpeg and ffprobe installed"
  configure_product: >
    Add -DKVM_MEDIA_FFMPEG=<workspace>/build-device-media/picolibc/xtensa to the
    standard IDF 6.1 ESP32-S3 application configure. Add -DKVM_MEDIA_SYNTHETIC_DIAG=ON
    only for the local diagnostic candidate. The archive builder takes the supplied
    ZIP, --target xtensa, --out, --shell and the same IDF picolibc --specs as the product.
  host_fixture: "python esp32-s3-kvmpad/test/live_view/check_codecs.py --cc clang --out build-device-media/native/corpus"
  host_build: >
    python esp32-s3-kvmpad/test/live_view/build_checks.py --cc clang --ffmpeg build-device-media/host
    --out build-device-media/native --lvgl build-sim/liblvgl_host.a --tlsf .tools/esp-idf-v6.1/components/heap/tlsf
  handoff: >
    python esp32-s3-kvmpad/test/live_view/check_device_h264.py spec-source/KVMpad_H264_Sources_Data_Models.zip
    build-device-media/native/h264_frames.exe --work build-device-media
  bounded: >
    python esp32-s3-kvmpad/test/live_view/check_live_worker.py build-device-media/native/bounded-codecs.dll
    build-device-media/native/corpus/h264-intra.avi --arena-kib 1792
tests:
  - test_id: H264-FILE-PLANES
    result: PASS
    steps: >
      Build the handoff FFmpeg 6.1.1, v2 reconstruction overlays and project workspace patch
      with tools/live_view/build_ffmpeg.py. Build the firmware API and host SHA driver with
      test/live_view/build_checks.py. Run test/live_view/check_device_h264.py against the
      supplied ZIP and h264_frames executable.
    observed: >
      Eight input SHA256s checked against the handoff. Probed coded/display geometry matched
      submitted frames. The FILE adapter demuxed MP4 or parsed Annex B and delivered all
      delayed frames in presentation order. Each of the exact, reduced and reduced large-bank
      modes matched the handoff Y, U and V plane SHA256s for 789 pictures, for a total of
      2367 pictures and 7101 plane comparisons. Exact mode decoded at native size and applied
      the handoff's rounded 2x2 reduction for hashing. Reduced modes emitted half-size planes.
      The FFmpeg allocation tracker reported zero outstanding bytes after every file.
    evidence: ["../build-device-media/native/planes.log"]
    host_32bit: >
      A separate 32-bit Windows x86 FFmpeg and driver build also matched all 7101 hashes.
      The 32-bit instrumentation explicitly aligned allocations to FFmpeg's 16-byte
      contract. test_1920x1080.h264 used 19304134 bytes exact and 13020479 reduced.
      test_640x360.h264 used 2811064 bytes exact and 2053157 reduced. With its two
      320x180 surfaces and the 65536-byte outer reserve, the latter requires at least
      2349093 bytes on this ABI, before stack and allocator overhead.
    host_32bit_evidence: "../build-device-media/native32/planes.log"
  - test_id: LIVE-H264-QUEUE
    result: PASS
    steps: "Run test/live_view/check_live_worker.py against native-codecs.dll and the three-frame h264-intra.avi from check_codecs.py."
    observed: >
      Three independently received 512x512 IDR access units matched all 786432 RGB565 pixels
      from a separate FFmpeg decode and NumPy conversion. Stride padding remained intact.
      New arrivals replaced the waiting frame while the worker retained its in-flight
      frame. Sequence wrap, stale input, combined access units, cancellation and zeroing on
      Stop passed. A valid 496x512 baseline IDR was rejected. The retained-YUV presenter
      then alternated 18 near-96-KiB IDRs, including one 86734-byte dense baseline IDR.
      The visible and in-flight slots remained independent. All RGB565 bands matched.
      Peak outstanding requests in that test were 1762694 bytes. ESP-IDF TLSF on the host
      passed the same test in 1760 KiB and in the configured 1792 KiB. It failed at
      1728 KiB. The harness includes control metadata, checks free-list and pool integrity
      and uses the host pointer ABI.
    evidence: ["../build-device-media/native/worker.log", "../build-device-media/native/finite-tlsf-1728.log", "../build-device-media/native/finite-tlsf-1760.log", "../build-device-media/native/finite-tlsf-1792.log"]
  - test_id: LIVE-LVGL-PRESENT
    result: PASS
    steps: >
      Supply the LVGL 9.6 host archive to build_checks.py. Run its AddressSanitizer
      panel_test with independent synthetic Cinepak/IDR fixture CRCs and a 48-frame 640x360
      H.264 MP4. Cinepak used native-size indexed blocks and H.264 used refcounted native
      YUV pictures. LVGL draw workers expanded each format in four-row RGB565 strips.
      The harness uses the production presenter and live decode API, a pthread
      decode worker, mocked transport and card presence, and a headless RGB565 display.
    observed: >
      Snapshot CRC32 of the full Cinepak 960x540 rectangle at (32,46) was 5552606e.
      The H.264 512x512 rectangle at (24,60) was 262b896e. Stop restored the Home snapshot.
      Late callbacks from an earlier epoch did not replace the current view. Simulated peer
      loss cleared the image. Removing the simulated card interrupted active file playback
      and restored Home. The compile-time development diagnostic generated synthetic
      checkerboards and found CRC32 b3d32c6e / 1b25dd0e (Cinepak) and 952e276e /
      5f1e7d54 (H.264) in the headless display buffer.
      It completed four measured refreshes with simulated VSYNC and bounce. The stalled
      counter control returned INCONCLUSIVE and restored Home. No sanitizer error was reported.
    evidence: ["../build-device-media/native/panel.log"]
  - test_id: CINEPAK-S3-LOCAL-PRESENT
    result: PASS
    steps: >
      Operator ran ui media-synthetic 5 30 on Waveshare unit 1. Two generated 960x540
      checkerboards passed the ordinary KVS2 CRC, session, queue, indexed color, LVGL
      stripe and DOUBLE_PARTIAL LCD paths. No Wi-Fi or desktop capture was involved.
    observed: >
      Phase 0 expected b3d32c6e, framebuffer 0 b3d32c6e, framebuffer 1 e135bade.
      Phase 1 expected 1b25dd0e, framebuffer 0 b3d32c6e, framebuffer 1 1b25dd0e.
      After these two warm-ups 30 flush-completed refreshes spanned 6199279 us from
      the first to the last, or 4.678 fps over 29 intervals. Median 213770 us,
      p95 213792 us, p99 213798 us. Measured VSYNC delta 217 and completed RGB bounce
