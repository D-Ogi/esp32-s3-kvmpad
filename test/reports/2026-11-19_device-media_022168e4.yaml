direct_h264_memory:
  result: PASS_SW
  change: >-
    For progressive, single-threaded Baseline pictures, FFmpeg can retain one aligned motion-vector table
    per picture. It keeps separate reference-list indices and marks list one unused. A mixed picture
    that later requests B prediction obtains a private second table before decoding that slice.
    The focused allocation test exercises both failure points and verifies that the original vectors
    and reference counts survive. Main/High and interlaced pictures retain their independent tables.
    For MP4 the decoder uses complete MOV samples and their container timestamps directly, avoiding the
    additional H.264 header parser in libavformat. Annex B keeps its access-unit parser.
  original_1080p: >-
    In the 32-bit host allocation probe, the original 73-frame test_1920x1080.h264 used 19,304,134
    bytes before and 17,210,566 after in Exact. Reduced and Large bank each fell from 13,020,479
    to 10,926,911 bytes. All three modes released every tracked allocation and matched the supplied
    golden Y/U/V planes. Even the smaller peak exceeds the board's entire 8 MiB PSRAM. Its existing
    dual-surface hardware trace recorded a largest block of only 18,432 bytes after presentation
    buffers for this file. Ordinary direct 1080p remains unavailable with this architecture.
  card_exact_640x360:
    target_memory: "1,802,240-byte arena, matching the four previous unit 1 failures."
    columns: [source_fps, previous_frames, current_frames, previous_min_free_bytes, current_min_free_bytes]
    rows:
      - [5, 12, 15, 19628, 137580]
      - [10, 12, 29, 31740, 146900]
      - [15, 12, 44, 46720, 153672]
      - [25, 12, 73, 62940, 165112]
    evidence: >-
      QEMU executed the target FFmpeg archives, production FILE callbacks, decoder and heap admission
      code, and the IDF build's multi_heap and TLSF objects. Each run probed the MP4 and then decoded
      it from immutable memory. The previous build reproduced all four hardware frame counts and
      all four byte-exact allocator low-water marks. With the change all 161 frames completed and
      each clip's native YUV420p SHA-256 matched stock FFmpeg. All target heap checks passed.
      A separate 32-bit host run checked all 483 full-resolution plane hashes and all 161 PTS values.
    scope: >-
      Generic Xtensa de233_fpu in QEMU 11.1 with a test handler for the S3's signed and unsigned
      high-half multiply instructions. The harness preserves the real register-window vectors.
      SD, scheduling, LCD and physical playback FPS require a unit test on hardware.
  corpus: "All 32 supplied spatial/temporal profiles passed: 3,365 presentation frames, 10,095 golden plane hashes, including timed and cancellation checks for both temporal modes."
  integration:
    ffmpeg_build: "ws:build-device-media/direct-ffmpeg/xtensa"
    libavcodec_sha256: "964722fc0751c410d8f76b7e96fe11268fb1ac714fbf94558d83e79e3e26ced9"
    link_check: >-
      build_ffmpeg.py applies ffmpeg-workspace.patch by default. Firmware CMake checks the resulting
