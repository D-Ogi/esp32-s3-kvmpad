builds:
  description: >
    Signed build outputs created offline from this decoder worktree, IDF 6.1, PSRAM XIP and
    DOUBLE_PARTIAL. Each signed image fits the existing 4194304-byte app partition.
    PSRAM upper bounds use the final link map's XIP-aligned offset and external BSS,
    then deduct both 1024x600 scanout buffers. Dynamic firmware allocations come next.
    These build digests identify the offline variants separately from the operator's trial.
  columns: [workspace_build, korean, compiler, signed_bytes, slot_free_bytes, gross_psram_after_static_scanout, firmware_sha256]
  rows:
