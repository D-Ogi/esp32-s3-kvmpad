    - [detail, "4:4:4", 2184907, 2166859]
    - [detail, "4:2:2", 1876286, 1854974]
    - [detail, "4:2:0", 1719211, 1695883]
    - [color-detail, "4:4:4", 2380460, 2362483]
    - [color-detail, "4:2:2", 1982870, 1961594]
    - [color-detail, "4:2:0", 1784270, 1760956]
  pixel_and_cancel_checks: >-
    All 3,686,400 candidate pixels match the baseline. Each decode preserves 3,424 guard words
    across both ends and all rows. Both variants stop at cancellation callback 128 after a
    partial write, refuse missing EOI, short entropy and short stride, and reproduce the
    measured RGB565 hash after reusing the decoder. Fixtures include a flat color chart,
    a half-chart with luma detail, full-frame luma detail and full-frame chroma/luma detail.
  reproduce: >-
    Run test/live_view/jpeg_rom/check.py per fixture and subsampling with --usb-monitor,
    --firmware-build, --idf, --rom, --toolchain and a separate --work directory per variant.
    Set --decoder-source to the recorded baseline.c for the first run and pass its frame.rgb565
    as --reference-frame for the candidate run.
