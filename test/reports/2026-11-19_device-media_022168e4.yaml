    method: >-
      Reconstruct the two Exact companions on the desktop, verify each frame CRC,
      then compare consecutive RGB565 pictures as presented at 960x540. Exclude the
      first full frame from each sequence. Tiles are anchored to the movie origin.
      A dirty tile includes all visible pixels of that tile. The bounded rectangles
      use greedy splits along tile boundaries with disjoint output rectangles.
    columns: [input, transitions, changed_pixels_pct, bounding_box_pct, dirty_16x16_tiles_pct, at_most_16_rectangles_pct]
